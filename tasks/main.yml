#####################################################################################
# Global
#####################################################################################

- name: Gathering facts if it was not done before
  ansible.builtin.setup:
  when: ansible_facts['os_family'] is not defined

#####################################################################################
# Enable access between containers (optional)
#####################################################################################

- name: Allow full access from containers
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: 'br-+'
    jump: ACCEPT
    comment: 'Allow containers access'
  become: true
  when: docker_intra_access | default(false)
  register: iptables_br

- name: Allow full access from containers on docker0
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: 'docker0'
    jump: ACCEPT
    comment: 'Allow containers access on docker0'
  become: true
  when: docker_intra_access | default(false)
  register: iptables_br2

- name: Save iptables
  ansible.builtin.shell:
    cmd: |
      iptables-save | grep -v 'TEMP ' | grep -v 'LIBVIRT_' \
      | grep -v -i 'docker' | grep -v 'A FORWARD ' \
      | grep -v 'ufw-' >/etc/iptables/rules.v4
  become: true
  check_mode: false
  when:
    - iptables_br.changed or iptables_br2.changed
    - docker_intra_access | default(false)

#####################################################################################
# Remove legacy apt sources (before any apt calls to avoid conflicts)
#####################################################################################

- name: Remove legacy docker.list apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true

- name: Remove legacy docker-archive-keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/docker-archive-keyring.gpg
    state: absent
  become: true

#####################################################################################
# Uninstall legacy packages
#####################################################################################

- name: Uninstall legacy docker packages
  ansible.builtin.apt:
    pkg:
      - docker.io
      - docker-doc
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent
  become: true

#####################################################################################
# Install prerequisites
#####################################################################################

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  become: true

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false
  become: true

- name: Set up the Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  become: true
  register: docker_repo

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: docker_repo.changed
  changed_when: false

#####################################################################################
# Install docker-ce
#####################################################################################

- name: Install Docker CE packages
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- ansible.builtin.debug:
    msg: "Docker version installed: {{ docker_version.stdout }}"

#####################################################################################
# docker-compose backwards-compatibility symlink
#####################################################################################

- name: Create docker-compose symlink for backwards compatibility
  ansible.builtin.file:
    src: /usr/libexec/docker/cli-plugins/docker-compose
    dest: /usr/local/bin/docker-compose
    state: link
  become: true

#####################################################################################
# Install python libraries
#####################################################################################

- name: Install python3-docker
  ansible.builtin.apt:
    name: python3-docker
    state: present
  become: true

